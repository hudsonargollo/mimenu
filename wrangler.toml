name = "mimenu"
compatibility_date = "2024-11-06"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = "dist"

# KV Namespace bindings for storing sessions and data
# These will be bound when deploying:
# wrangler kv:namespace create MIMENU_SESSIONS
# wrangler kv:namespace create MIMENU_DATA
[kv_namespaces]
# binding = "MIMENU_KV"

# Environment variables (available at build time and runtime)
[vars]
# Frontend environment variables - REMOVED: SUPABASE_URL, VITE_SUPABASE_PUBLISHABLE_KEY
# Authentication is now email-based, no external DB needed

